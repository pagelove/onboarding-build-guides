name: Check build guides
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code
